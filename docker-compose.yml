services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financeflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend-node:
    build: ./backend-node
    restart: unless-stopped
    env_file: ./backend-node/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/financeflow?schema=public
      PYTHON_SERVICE_URL: http://backend-python:8000
    ports:
      - "4000:4000"
    depends_on:
      - db
      - backend-python

  backend-python:
    build: ./backend-python
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "5173:80"

volumes:
  db_data:
