<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — FinanceFlow MP</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="centered-screen">
    <div class="auth-card">
      <h1>Criar conta</h1>
      <p class="subtitle">Comece a organizar suas contas do Mercado Pago em um so lugar</p>

      <div class="error-msg" id="error-msg"></div>

      <form onsubmit="handleRegister(event)">
        <div class="field">
          <label for="name">Nome</label>
          <input type="text" id="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">Criar conta</button>
      </form>

      <p class="auth-switch">Ja tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
