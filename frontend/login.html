<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — FinanceFlow MP</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="centered-screen">
    <div class="auth-card">
      <h1>FinanceFlow MP</h1>
      <p class="subtitle">Entre para ver suas contas conectadas ao Mercado Pago</p>

      <div class="error-msg" id="error-msg"></div>

      <form onsubmit="handleLogin(event)">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <p class="auth-switch">Ainda nao tem conta? <a href="register.html">Cadastre-se</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
